services:
  worker1:
    build: ./worker1
    container_name: worker1
    volumes:
      # Исходные данные (read)
      - ./data:/var/data
      # Промежуточный результат (write) — сюда кладём data.txt
      - ./result-1:/var/result

  worker2:
    build: ./worker2
    container_name: worker2
    volumes:
      # Читаем data.txt из result-1
      - ./result-1:/var/data
      # Финальный результат
      - ./result:/var/result
    depends_on:
      - worker1